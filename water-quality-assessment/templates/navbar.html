<style>
  .wq-navbar {
    height: 48px;
    background: #0f2744;
    display: flex;
    align-items: center;
    padding: 0 1.25rem;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 200;
    border-bottom: 1px solid rgba(255, 255, 255, .07);
  }

  .wq-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: .9rem;
    white-space: nowrap;
    margin-right: .5rem;
  }

  .wq-brand svg {
    color: #38bdf8;
    flex-shrink: 0;
  }

  .wq-nav-links {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
  }

  .wq-nav-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: .4rem .85rem;
    border-radius: 8px;
    color: rgba(255, 255, 255, .7);
    text-decoration: none;
    font-size: .82rem;
    font-weight: 500;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }

  .wq-nav-link:hover {
    background: rgba(255, 255, 255, .1);
    color: #fff;
  }

  .wq-nav-link.active {
    background: rgba(255, 255, 255, .15);
    color: #fff;
  }

  /* HAMBURGER */
  .wq-menu-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .wq-hamburger {
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    cursor: pointer;
    transition: background .15s;
    padding: 0;
  }

  .wq-hamburger:hover {
    background: rgba(255, 255, 255, .16);
  }

  .wq-hamburger span {
    display: block;
    width: 16px;
    height: 1.5px;
    background: rgba(255, 255, 255, .85);
    border-radius: 2px;
    transition: all .22s ease;
    transform-origin: center;
  }

  /* Animate to X when open */
  .wq-hamburger.open span:nth-child(1) {
    transform: translateY(6.5px) rotate(45deg);
  }

  .wq-hamburger.open span:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
  }

  .wq-hamburger.open span:nth-child(3) {
    transform: translateY(-6.5px) rotate(-45deg);
  }

  /* DROPDOWN */
  .wq-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    background: #fff;
    border: 1px solid rgba(15, 39, 68, .12);
    border-radius: 13px;
    min-width: 240px;
    box-shadow: 0 20px 60px rgba(15, 39, 68, .18), 0 4px 16px rgba(15, 39, 68, .08);
    overflow: hidden;
    z-index: 300;
    animation: ddIn .15s ease;
  }

  .wq-dropdown.open {
    display: block;
  }

  @keyframes ddIn {
    from {
      opacity: 0;
      transform: translateY(-8px) scale(.97);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .wq-dd-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background .12s;
    text-decoration: none;
    color: inherit;
    border: none;
    width: 100%;
    background: none;
    text-align: left;
    font-family: 'Sarabun', sans-serif;
  }

  .wq-dd-item:hover {
    background: #f8fafc;
  }

  .wq-dd-icon {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #64748b;
    transition: background .15s;
  }

  .wq-dd-label {
    flex: 1;
    min-width: 0;
  }

  .wq-dd-title {
    font-size: 13px;
    font-weight: 600;
    color: #0f2744;
    line-height: 1.3;
  }

  .wq-dd-sub {
    font-size: 11px;
    color: #64748b;
    margin-top: 1px;
  }

  .wq-dd-divider {
    height: 1px;
    background: rgba(15, 39, 68, .07);
  }

  /* Logout */
  .wq-dd-logout .wq-dd-icon {
    background: #fee2e2;
    color: #dc2626;
  }

  .wq-dd-logout .wq-dd-title {
    color: #dc2626;
  }

  .wq-dd-logout:hover {
    background: #fff5f5;
  }

  /* TOGGLE SWITCH */
  .wq-toggle-track {
    width: 40px;
    height: 22px;
    border-radius: 11px;
    background: #e2e8f0;
    position: relative;
    transition: background .22s;
    flex-shrink: 0;
    cursor: pointer;
  }

  .wq-toggle-track.on {
    background: #0ea5e9;
  }

  .wq-toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
    transition: transform .22s ease;
  }

  .wq-toggle-track.on .wq-toggle-thumb {
    transform: translateX(18px);
  }

<script>
  /* ── Dark mode: apply before paint to avoid flash ── */
  (function () {
    if (localStorage.getItem('wq-dark') === '1') {
      document.documentElement.classList.add('dark');
    }
  })();

  function wqSyncUI() {
    const on = document.documentElement.classList.contains('dark');
    const track = document.getElementById('wqToggleTrack');
    const label = document.getElementById('wqDarkLabel');
    const icon = document.getElementById('wqDarkIcon');
    const iconWrap = document.getElementById('wqDarkIconWrap');
    if (track) track.classList.toggle('on', on);
    if (label) label.textContent = on ? 'Light Mode' : 'Dark Mode';
    if (iconWrap) iconWrap.style.background = on ? 'rgba(14,165,233,.15)' : '';
    if (iconWrap) iconWrap.style.color = on ? '#38bdf8' : '';
    if (icon) icon.innerHTML = on
      ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }

  function wqToggleDark() {
    const on = document.documentElement.classList.toggle('dark');
    localStorage.setItem('wq-dark', on ? '1' : '0');
    wqSyncUI();
  }

  function wqToggleMenu() {
    const btn = document.getElementById('wqMenuBtn');
    const dd = document.getElementById('wqDropdown');
    const open = dd.classList.toggle('open');
    btn.classList.toggle('open', open);
  }

  document.addEventListener('click', function (e) {
    const wrap = document.querySelector('.wq-menu-wrap');
    if (wrap && !wrap.contains(e.target)) {
      document.getElementById('wqMenuBtn')?.classList.remove('open');
      document.getElementById('wqDropdown')?.classList.remove('open');
    }
  });

  document.addEventListener('DOMContentLoaded', wqSyncUI);
</script>
