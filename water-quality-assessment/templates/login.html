<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Water Quality System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        :root {
            --brand: #2c5aa0;
            --brand2: #1e4180;
            --bg: #f6f7fb;
            --card: #ffffff;
            --border: #e6eaf2;
            --text: #111827;
            --muted: #6b7280;
            --shadow: 0 14px 36px rgba(15, 23, 42, .10);
            --radius: 18px;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background:
                radial-gradient(1100px 520px at 10% -10%, rgba(44, 90, 160, .12), transparent 55%),
                radial-gradient(900px 500px at 110% 10%, rgba(30, 65, 128, .10), transparent 60%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .login-shell {
            width: 100%;
            max-width: 520px;
            padding: 0 12px;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            transform: translateY(0);
            transition: .2s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
        }

        .login-top {
            padding: 1.25rem 1.25rem 1rem;
            background: linear-gradient(135deg, rgba(44, 90, 160, .18), rgba(44, 90, 160, .06));
            border-bottom: 1px solid rgba(44, 90, 160, .12);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: .9rem;
        }

        .brand-badge {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            box-shadow: 0 12px 22px rgba(44, 90, 160, .18);
            flex: 0 0 auto;
        }

        .brand-badge i {
            font-size: 1.6rem;
            color: #fff;
        }

        .brand-title {
            margin: 0;
            font-weight: 950;
            letter-spacing: -.2px;
            color: var(--brand);
            line-height: 1.1;
            font-size: 1.35rem;
        }

        .brand-sub {
            margin: 0;
            color: var(--muted);
            font-weight: 700;
            font-size: .95rem;
        }

        .login-body {
            padding: 1.25rem;
        }

        .form-label {
            font-weight: 950;
            color: #374151;
            margin-bottom: .45rem;
        }

        .input-group-text {
            border-radius: 14px 0 0 14px;
            border: 1px solid rgba(17, 24, 39, .12);
            background: rgba(44, 90, 160, .08);
            color: var(--brand);
            font-weight: 900;
            min-width: 48px;
            justify-content: center;
        }

        .form-control {
            border-radius: 0 14px 14px 0;
            border: 1px solid rgba(17, 24, 39, .12);
            padding: .7rem .95rem;
        }

        .form-control:focus {
            border-color: rgba(44, 90, 160, .45);
            box-shadow: 0 0 0 .2rem rgba(44, 90, 160, .12);
        }

        .toggle-btn {
            border-radius: 0 14px 14px 0 !important;
            border: 1px solid rgba(17, 24, 39, .12);
            background: #fff;
            color: var(--brand);
            font-weight: 950;
        }

        .toggle-btn:hover {
            background: rgba(44, 90, 160, .06);
        }

        .btn {
            border-radius: 14px;
            font-weight: 950;
            padding: .62rem 1rem;
            transition: .2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--brand);
            box-shadow: 0 10px 22px rgba(44, 90, 160, .18);
            height:48px;
            font-size:1rem;
        }

        .btn-primary:hover {
            background: var(--brand2);
        }

        .btn-outline-primary {
            background: #fff;
            color: var(--brand);
            border: 1px solid rgba(44, 90, 160, .35);
        }

        .btn-outline-primary:hover {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        .help-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .75rem;
            margin-top: .25rem;
        }

        .form-check-label {
            color: #475569;
            font-weight: 700;
            font-size: .92rem;
        }

        .mini {
            font-size: .9rem;
            color: var(--muted);
            font-weight: 700;
        }

        .info-box {
            margin-top: 1rem;
            border-radius: 16px;
            padding: 1rem;
            background: rgba(44, 90, 160, .06);
            border: 1px solid rgba(44, 90, 160, .18);
        }

        .info-box strong {
            color: var(--brand);
        }

        code {
            background: rgba(44, 90, 160, .10);
            padding: .15rem .5rem;
            border-radius: 10px;
            color: var(--brand2);
            font-weight: 950;
        }

        .footer {
            text-align: center;
            margin-top: 1rem;
            color: var(--muted);
            font-weight: 700;
            font-size: .9rem;
        }
        .form-control:focus{
        border-color:#2c5aa0;
        box-shadow:0 0 0 .25rem rgba(44,90,160,.15);
        }

        .login-card{
        box-shadow:
            0 20px 60px rgba(15,23,42,.15),
            0 10px 25px rgba(15,23,42,.08);
        }



        /* Alerts (ให้ดูสะอาดขึ้น) */
        .alert {
            border-radius: 16px;
            border: 1px solid rgba(17, 24, 39, .08);
            box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
        }

        @media (max-width: 576px) {
            .login-top {
                padding: 1rem;
            }

            .login-body {
                padding: 1rem;
            }

            .brand-title {
                font-size: 1.2rem;
            }
        }
        .login-card{
        animation:fadeIn .4s ease;
        }

        @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(10px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
        }

    </style>
</head>

<body>
    <div class="login-shell">

        <div class="login-card">
            <!-- Top -->
            <div class="login-top">
                <div class="brand-row">
                    <div class="brand-badge">
                        <i class="bi bi-droplet-fill"></i>
                    </div>
                    <div>
                        <h1 class="brand-title">Water Quality System</h1>
                        <p class="brand-sub">เข้าสู่ระบบสำหรับผู้ดูแลระบบ</p>
                    </div>
                </div>
            </div>

            <div class="login-body">
                <!-- Flash Messages -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <!-- Login Form -->
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person-circle me-1"></i> ชื่อผู้ใช้
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                placeholder="กรอกชื่อผู้ใช้" required autofocus>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label for="password" class="form-label">
                            <i class="bi bi-shield-lock me-1"></i> รหัสผ่าน
                        </label>

                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                placeholder="กรอกรหัสผ่าน" required>
                            <button class="btn toggle-btn" type="button" id="togglePassword"
                                aria-label="toggle password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <div class="help-row">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">จำฉันไว้</label>
                            </div>
                            <span class="mini"><i class="bi bi-shield-check me-1"></i>Secure login</span>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
                        </button>
                        <a href="{{ url_for('public_dashboard') }}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left me-1"></i> กลับไปหน้าสาธารณะ
                        </a>
                    </div>
                </form>

               
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show/Hide password
        const toggle = document.getElementById('togglePassword');
        const pwd = document.getElementById('password');

        toggle.addEventListener('click', () => {
            const isPassword = pwd.getAttribute('type') === 'password';
            pwd.setAttribute('type', isPassword ? 'text' : 'password');
            toggle.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    </script>
</body>

</html>
